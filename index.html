<footer class="bottom"><div class="bottom-left"><button class="subbtn" onclick="undo()" id="undoBtn" aria-label="Desfazer última ação">↶ Desfazer</button><span class="hint" id="hint">Toque no jogador</span></div><button id="whistleBtn" class="whistle-btn" onclick="blowWhistle()" aria-label="Soar apito" title="Apito"><svg viewBox="0 0 36 30" fill="none" aria-hidden="true"><path d="M6 16a9 9 0 1 0 18 0v-3l8-3V4L18 8h-3a9 9 0 0 0-9 8Z" fill="currentColor"/><circle cx="15" cy="17" r="4.5" fill="#183940"/><path d="m24 3 1-2m5 0 2-1M5 23l-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><div class="bottom-right"><button class="subbtn" onclick="showHelp()" aria-label="Como usar">?</button><button class="servebtn" id="serveBtn" onclick="markServe()">Marcar saque</button></div></footer></div>
<div id="overlay" class="backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><section class="panel" id="panel"><div class="panel-head"><h2 id="panelTitle"></h2><button class="close" onclick="closePanel()" aria-label="Fechar">×</button></div><div id="panelBody" class="panel-body"></div></section></div>
<div id="radialLayer" class="radial-layer hidden"><svg id="gestureTrail" class="gesture-trail"></svg><div id="gesturePath" class="gesture-path"></div><button id="gestureCancel" class="gesture-cancel">×<small>cancelar</small></button><div id="gestureOptions"></div><div class="radialtip" id="radialTip">Arraste para escolher. Solte no centro para cancelar.</div></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='voleihub_areia_teste_v2';
const TAGS=['Ataque','Defesa','Levantamento','Saque'];
const NAMES=['Anny','Braz','Caléb','Christian','Daniele','Hemily','Isa','Kemilly','Lucas','Luiz','Magno','Maicon','Marciano','Matheus','Odair','Paty','Rhuana','Samuel','Yuri'];
const DEFAULTS={points:12,tie:'three',maxWins:3,reaction:'both',window:6,minAttack:1,minDefense:2,minSet:1,minServe:1,maxBeginner:1,showScore:true,speech:true,hold:300,weights:{attack:1,ace:1.5,block:2,assist:.75,receive:.25,defense:.3,recover:.3,error:.5,win:3}};
const STATS=['attack','ace','block','assist','receive','defense','recover','error','attempt','setAttempt','serves','wins','losses','games'];
const clone=o=>JSON.parse(JSON.stringify(o));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankStats=()=>Object.fromEntries(STATS.map(k=>[k,0]));
function initial(){const players=NAMES.map((name,i)=>({id:'p'+i,name,tags:[],beginner:false,blocked:false,skips:0,stats:blankStats()}));return {version:2,players,teams:{A:[null,null,null,null],B:[null,null,null,null]},queue:players.map(p=>p.id),score:{A:0,B:0},streak:{A:0,B:0},server:'A',initialServer:'A',startedAt:null,endedAt:null,pausedAt:null,pausedMs:0,status:'ready',serveReady:true,servesThisMatch:0,deuce:false,run:{side:null,count:0},matchNo:1,log:[],matches:[],rally:null,pairs:{},config:clone(DEFAULTS),formationNote:'Toque nas oito vagas para montar os times ou use a formação automática.',initialScores:null,participants:null};}
let S=initial(),undos=[],storageOK=true,panelFocus=null,draft=null,radialCtx=null,gesture=null,toastTimer;
try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x.version===2&&validState(x))S=x;}else{const legacyRaw=localStorage.getItem('voleihub_areia_teste_v1');if(legacyRaw){const old=JSON.parse(legacyRaw),fresh=initial();fresh.config={...clone(DEFAULTS),...old.config,weights:{...DEFAULTS.weights,...old.config?.weights}};fresh.players.forEach(p=>{const prev=old.players?.find(x=>x.id===p.id);p.tags=(prev?.tags||[]).filter(t=>TAGS.includes(t));p.beginner=!!prev?.beginner;});if(validState(fresh))S=fresh;}}}catch(e){storageOK=false;}
function validState(s){if(!s||s.version!==2||!Array.isArray(s.players)||s.players.length<8||!s.teams||!Array.isArray(s.queue)||!s.config||!s.score||!s.streak||!Array.isArray(s.log)||!Array.isArray(s.matches)||!s.pairs||!s.config.weights||!Object.keys(DEFAULTS.weights).every(k=>Number.isFinite(s.config.weights[k])&&s.config.weights[k]>=0&&s.config.weights[k]<=20)||!['minAttack','minDefense','minSet','minServe','maxBeginner'].every(k=>Number.isInteger(s.config[k])&&s.config[k]>=0&&s.config[k]<=4)||!Number.isInteger(s.config.window)||s.config.window<4||s.config.window>8||!Number.isInteger(s.config.maxWins)||s.config.maxWins<0||s.config.maxWins>20)return false;const ids=s.players.map(p=>p.id);if(new Set(ids).size!==ids.length||!s.players.every(p=>/^p[0-9]+$/.test(p.id)&&typeof p.name==='string'&&p.name.length<80&&Array.isArray(p.tags)&&p.tags.every(t=>TAGS.includes(t))&&p.stats&&STATS.every(k=>Number.isFinite(p.stats[k])&&p.stats[k]>=0)))return false;if(!Array.isArray(s.teams.A)||!Array.isArray(s.teams.B))return false;const loc=[...s.teams.A,...s.teams.B,...s.queue].filter(id=>id!==null);return s.teams.A.length===4&&s.teams.B.length===4&&(s.status==='ready'||[...s.teams.A,...s.teams.B].every(Boolean))&&new Set(loc).size===loc.length&&loc.length===ids.length&&loc.every(id=>ids.includes(id))&&['A','B'].includes(s.server)&&['ready','playing','ended'].includes(s.status)&&['A','B'].every(t=>Number.isInteger(s.score[t])&&s.score[t]>=0)&&s.config.points>=3&&s.config.points<=99&&['two','three'].includes(s.config.tie)&&['both','split'].includes(s.config.reaction);}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;toast('Salvamento local indisponível. Exporte o teste em Configurações.');}}
function player(id){return S.players.find(p=>p.id===id)}function name(id){return player(id)?.name||'Não informado'}function sideOf(id){return ['A','B'].find(t=>S.teams[t].includes(id))}function other(t){return t==='A'?'B':'A'}function teamName(t){return 'Time '+t}function inc(id,k,n=1){if(id&&player(id))player(id).stats[k]+=n}
function transact(fn){const before=clone(S),positions=capturePositions();undos.push(before);if(undos.length>45)undos.shift();fn();persist();render();animateChange(before,positions);}
function log(text,kind='info',details={}){S.log.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),at:Date.now(),match:S.matchNo,text,kind,score:clone(S.score),...details});narratePoint(S.log[0]);}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3400);}
function undo(){if(!undos.length)return toast('Nenhuma ação desta abertura para desfazer.');closeRadial();closePanel();S=undos.pop();persist();render();toast('Última ação desfeita, incluindo pontos e estatísticas.');}
function scorePlayer(id){const s=player(id).stats,w=S.config.weights;return s.attack*w.attack+s.ace*w.ace+s.block*w.block+s.assist*w.assist+s.receive*w.receive+s.defense*w.defense+s.recover*w.recover-s.error*w.error+s.wins*w.win;}
function averageTeam(ids){ids=ids.filter(Boolean);return ids.length?ids.reduce((n,id)=>n+scorePlayer(id),0)/ids.length:0;}
function coverage(ids){return TAGS.map(t=>ids.filter(id=>id&&player(id).tags.includes(t)).length)}
function fullCourt(){return [...S.teams.A,...S.teams.B].every(Boolean);}
function positions(t){return t==='A'?[[48,77],[83,50],[48,23],[26,50]]:[[52,23],[17,50],[52,77],[74,50]];}
function render(){stopVisual();for(const t of ['A','B']){const ids=S.teams[t],coords=positions(t);$('half'+t).innerHTML=`<div class="sideinfo"><strong>${teamName(t).toUpperCase()}</strong><span>score ${averageTeam(ids).toFixed(2)}</span></div>`+ids.map((id,i)=>{const serving=!!id&&S.server===t&&i===0,waiting=serving&&S.serveReady&&S.status!=='ended',x=waiting?(t==='A'?8:92):coords[i][0];return `<button class="player ${serving?'serving':''} ${waiting?'outside':''} ${!id?'empty':''}" ${id?`data-player="${id}"`:`data-slot="${t}:${i}"`} style="left:${x}%;top:${coords[i][1]}%" aria-label="${id?esc(name(id)):'Selecionar jogador'}, ${teamName(t)}, posição ${i+1}"><span class="orb"><span class="pos">${i+1}</span>${id?esc(name(id).slice(0,2).toUpperCase()):'+'}</span><span class="pname">${id?esc(name(id)):'Selecionar'}</span><span class="ptags">${id?player(id).tags.map(x=>({Ataque:'ATQ',Defesa:'DEF',Levantamento:'LEV',Saque:'SAQ'}[x])).join(' · ')||'SEM TAGS':['SAQUE','REDE','FUNDO ESQ.','FUNDO MEIO'][i]}</span>${waiting?'<span class="positionlabel">sacando</span>':i===1?'<span class="positionlabel">rede</span>':''}</button>`;}).join('');$('score'+t).textContent=S.score[t];$('wins'+t).textContent=S.streak[t]+' vitória'+(S.streak[t]===1?'':'s')+' seguida'+(S.streak[t]===1?'':'s');}
$('queueCount').textContent=S.queue.filter(id=>!player(id).blocked).length;$('target').innerHTML=`ATÉ ${S.config.points}<br>${S.deuce&&S.config.tie==='three'?`SEQUÊNCIA ${S.run.count}/3`:'PARTIDA '+S.matchNo}`;$('undoBtn').disabled=!undos.length;$('serveBtn').textContent=!fullCourt()?'⚡ Formar times':S.status==='ended'?'Próxima partida':S.serveReady?'▶ Saque · '+name(S.teams[S.server][0]):'● Bola em jogo';$('serveBtn').disabled=fullCourt()&&S.status!=='ended'&&!S.serveReady;$('serveBtn').onclick=!fullCourt()?rebalanceReady:markServe;$('hint').textContent=!storageOK?'⚠ Exporte para guardar seu teste':!fullCourt()?'Toque nas vagas • monte os oito jogadores':S.status==='ended'?'Partida encerrada • confira e avance':'Toque no jogador • selecione a ação';$('matchend').classList.toggle('hidden',S.status!=='ended');if(S.status==='ended')$('matchend').innerHTML=`${teamName(S.winner)} venceu · ${S.score.A} × ${S.score.B}<button onclick="nextMatch()">Próxima partida →</button>`;document.body.classList.toggle('no-score',!S.config.showScore);tick();syncBall();}
// Visual state is independent of match state. Interrupting an animation never changes statistics.
let visualEpoch=0,liveAnimations=[];
function reducedMotion(){return window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;}
function stopVisual(){visualEpoch++;liveAnimations.forEach(a=>{try{a.cancel()}catch{}});liveAnimations=[];}
function capturePositions(){const points={};const court=$('court').getBoundingClientRect?.();if(!court)return points;$('court').querySelectorAll('[data-player]').forEach(el=>{const r=el.querySelector('.orb').getBoundingClientRect();points[el.dataset.player]={x:r.left+r.width/2-court.left,y:r.top+r.height/2-court.top};});return points;}
function currentPoint(id){return capturePositions()[id]||null;}
function ballTarget(){if(!fullCourt())return null;const c=$('court').getBoundingClientRect();if(S.serveReady||S.status==='ended')return currentPoint(S.teams[S.server][0]);if(S.rally?.defender)return currentPoint(S.rally.defender);const context=rallyContext();return {x:c.width*(context.owner==='A'?.28:.72),y:c.height*.5};}
function placeBall(p,held=true){const b=$('liveBall');if(!p){b.classList.add('hidden');return;}b.classList.remove('hidden');b.classList.toggle('held',held);b.style.left=(p.x+(held?19:0))+'px';b.style.top=(p.y+(held?-17:0))+'px';}
function syncBall(){placeBall(ballTarget(),!!(S.serveReady||S.rally?.defender));}
function animation(el,frames,opts){if(!el?.animate||reducedMotion())return Promise.resolve();const a=el.animate(frames,opts);liveAnimations.push(a);return a.finished.catch(()=>{});}
async function fly(from,to,token,duration=420){if(token!==visualEpoch||!from||!to)return;const b=$('liveBall');placeBall(to,false);await animation(b,[{transform:`translate(calc(-50% + ${from.x-to.x}px), calc(-50% + ${from.y-to.y}px)) rotate(0deg)`},{transform:`translate(calc(-50% + ${(from.x-to.x)/2}px), calc(-50% + ${(from.y-to.y)/2-24}px)) rotate(170deg)`,offset:.5},{transform:'translate(-50%,-50%) rotate(340deg)'}],{duration,easing:'ease-in-out'});}
async function advance(id,at,token){const el=$('court').querySelector(`[data-player="${id}"]`),p=currentPoint(id);if(!el||!p||token!==visualEpoch)return;const c=$('court').getBoundingClientRect(),dx=c.width*(sideOf(id)==='A'?.44:.56)-p.x,dy=c.height*.5-p.y,bx=Number(el.dataset.fxX)||0,by=Number(el.dataset.fxY)||0;const base=`translate(calc(-50% + ${bx}px),calc(-50% + ${by}px))`,near=`translate(calc(-50% + ${bx+dx}px),calc(-50% + ${by+dy}px)) scale(1.12)`;await animation(el,[{transform:base},{transform:near,offset:.45},{transform:near,offset:.65},{transform:base}],{duration:760,easing:'ease-in-out'});}
async function animateChange(before,old){const token=visualEpoch,now=capturePositions(),e=S.log[0],newEvent=e&&e.id!==before.log[0]?.id,c=$('court').getBoundingClientRect(),scored=S.score.A!==before.score.A||S.score.B!==before.score.B,moves=[];for(const [id,to]of Object.entries(now)){const from=old[id];if(from&&(Math.abs(from.x-to.x)>1||Math.abs(from.y-to.y)>1)){const el=$('court').querySelector(`[data-player="${id}"]`),dx=from.x-to.x,dy=from.y-to.y,start=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;const move=()=>{el.style.transform='';el.dataset.fxX=0;el.dataset.fxY=0;return animation(el,[{transform:start},{transform:'translate(-50%,-50%)'}],{duration:700,easing:'cubic-bezier(.2,.75,.2,1)'});};if(scored&&newEvent){el.style.transform=start;el.dataset.fxX=dx;el.dataset.fxY=dy;moves.push(move);}else move();}}
if(!newEvent||!fullCourt())return;const point=id=>old[id]||now[id],netPoint=id=>({x:c.width*(sideOf(id)==='A'?.44:.56),y:c.height*.5});let from=point(before.rally?.defender)||point(before.teams[before.server][0]);
if(e.kind==='serve'){await fly(point(before.teams[before.server][0]),ballTarget(),token,650);}
else if(['attack','tip','feint'].includes(e.action)){const hitter=point(e.actor);if(e.setter){await fly(from,point(e.setter),token,250);from=point(e.setter);}await fly(from,hitter,token,280);if(token!==visualEpoch)return;advance(e.actor,hitter,token);const near=netPoint(e.actor);await fly(hitter,near,token,250);const target=e.defender?point(e.defender):{x:c.width*(sideOf(e.actor)==='A'?.76:.24),y:c.height*.67};await fly(near,target,token,440);}
else if(e.action==='ace'){await fly(point(e.actor),e.receiver?point(e.receiver):{x:c.width*(sideOf(e.actor)==='A'?.78:.22),y:c.height*.68},token,600);}
else if(e.action==='block'){await fly(point(e.source),netPoint(e.actor),token,400);if(token!==visualEpoch)return;advance(e.actor,point(e.actor),token);if(e.point)await fly(netPoint(e.actor),{x:c.width*(sideOf(e.actor)==='A'?.63:.37),y:c.height*.66},token,280);}
else if(e.kind==='defense'&&e.actor){await fly(point(e.source)||from,point(e.actor),token,550);}
if(token!==visualEpoch)return;if(scored){const t=S.score.A>before.score.A?'A':'B';$('pointFlash').textContent='+1 · '+teamName(t);await animation($('pointFlash'),[{opacity:0,transform:'translate(-50%,-50%) scale(.8)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)',offset:.3},{opacity:0,transform:'translate(-50%,-65%) scale(1.05)'}],{duration:650});if(token!==visualEpoch)return;await Promise.all(moves.map(fn=>fn()));if(token!==visualEpoch)return;await animation($('liveBall'),[{opacity:1},{opacity:0}],{duration:120});if(token!==visualEpoch)return;syncBall();await animation($('liveBall'),[{opacity:0},{opacity:1}],{duration:180});}if(token===visualEpoch)syncBall();}
function elapsedMs(now=Date.now()){return S.startedAt?Math.max(0,(S.pausedAt||S.endedAt||now)-S.startedAt-(S.pausedMs||0)):0;}
function tick(){const duration=Math.floor(elapsedMs()/1000);$('clock').textContent=String(Math.floor(duration/60)).padStart(2,'0')+':'+String(duration%60).padStart(2,'0');$('timerLabel').textContent=S.status==='ended'?'encerrada':S.pausedAt?'▶ retomar':S.startedAt?'Ⅱ pausar':'▶ iniciar';$('clockButton').classList.toggle('paused',!!S.pausedAt);}
function toggleClock(){if(!fullCourt())return toast('Complete os oito jogadores para iniciar.');if(S.status==='ended')return toast('Cronômetro encerrado. Avance para a próxima partida.');transact(()=>{if(!S.startedAt){startClock();log('Cronômetro iniciado manualmente','timer');}else if(S.pausedAt){S.pausedMs=(S.pausedMs||0)+Date.now()-S.pausedAt;S.pausedAt=null;log('Cronômetro retomado','timer');}else{S.pausedAt=Date.now();log('Cronômetro pausado','timer');}});}
function openPanel(title,body,wide=false){panelFocus=document.activeElement;$('panelTitle').textContent=title;$('panelBody').innerHTML=body;$('panel').classList.toggle('wide',wide);$('overlay').classList.remove('hidden');$('panelBody').scrollTop=0;}
function closePanel(){const was=!$('overlay').classList.contains('hidden');$('overlay').classList.add('hidden');draft=null;if(was&&panelFocus?.isConnected)panelFocus.focus();}
function pick(title,description,options){openPanel(title,`<p class="description">${description}</p><div class="choices">${options.map((o,i)=>`<button class="choice ${o.cls||''}" data-pick="${i}">${esc(o.label)}${o.sub?'<small>'+esc(o.sub)+'</small>':''}</button>`).join('')}</div>`);$('panelBody').querySelectorAll('[data-pick]').forEach(b=>b.onclick=options[Number(b.dataset.pick)].fn);}
function pickPlayer(title,desc,ids,fn,extra=[]){pick(title,desc,[...ids.map(id=>({label:name(id),fn:()=>fn(id)})),...extra]);}
function startClock(){if(!S.startedAt){S.startedAt=Date.now();S.pausedAt=null;S.pausedMs=0;S.participants=clone(S.teams);S.initialScores={A:averageTeam(S.teams.A),B:averageTeam(S.teams.B)};}S.status='playing';}
function ensureRally(){startClock();if(S.serveReady){S.serveReady=false;S.rally={id:Date.now(),lastAttack:null,defender:null,defenseType:null};}if(!S.rally)S.rally={id:Date.now(),lastAttack:null,defender:null,defenseType:null};}
function markServe(){if(!fullCourt())return toast('Selecione os oito jogadores antes do primeiro saque.');if(S.status==='ended')return nextMatch();if(!S.serveReady)return;transact(()=>{ensureRally();inc(S.teams[S.server][0],'serves');S.servesThisMatch++;S.rally.serveMarked=true;S.rally.server=S.teams[S.server][0];log('Saque iniciado · '+name(S.teams[S.server][0]),'serve');});}
function rotate(t){S.teams[t].push(S.teams[t].shift());}
function award(t){S.score[t]++;if(S.server!==t){rotate(t);S.server=t;}S.serveReady=true;S.rally=null;const min=S.config.points-1;if(S.config.tie==='three'){if(!S.deuce&&S.score.A===S.score.B&&S.score.A>=min){S.deuce=true;S.run={side:null,count:0};}else if(S.deuce){S.run=S.run.side===t?{side:t,count:S.run.count+1}:{side:t,count:1};}}
const won=S.config.tie==='two'?S.score[t]>=S.config.points&&S.score[t]-S.score[other(t)]>=2:S.deuce?S.run.count>=3:S.score[t]>=S.config.points;if(won)finish(t);}
function finish(t){S.status='ended';S.endedAt=Date.now();S.winner=t;S.streak[t]++;S.streak[other(t)]=0;for(const side of ['A','B']){(S.participants?.[side]||S.teams[side]).forEach(id=>{inc(id,'games');inc(id,side===t?'wins':'losses')});const ids=S.teams[side];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const key=[ids[i],ids[j]].sort().join('|');S.pairs[key]=(S.pairs[key]||0)+1;}}S.matches.unshift({number:S.matchNo,teams:clone(S.teams),score:clone(S.score),winner:t,startedAt:S.startedAt,endedAt:S.endedAt,durationMs:elapsedMs(),initialScores:S.initialScores,participants:clone(S.participants||S.teams)});}

function chooseOne(base,opponent,need=4-base.length){const q=eligible(),window=q.slice(0,Math.max(need,S.config.window)),forced=q.filter(id=>player(id).skips>0).slice(0,need);if(q.length<need)return null;let best=null,cost=null;for(const add of combinations(window,need)){if(forced.some(id=>!add.includes(id)))continue;const tc=teamCost([...base,...add],opponent),c=[tc[0],tc[1],add.reduce((s,id)=>s+q.indexOf(id),0),tc[2]];if(less(c,cost)){cost=c;best=add;}}return best||q.slice(0,need);}
function consume(ids){const q=eligible(),last=Math.max(...ids.map(id=>q.indexOf(id)));q.slice(0,last+1).forEach(id=>{if(!ids.includes(id))player(id).skips++;});S.queue=S.queue.filter(id=>!ids.includes(id));ids.forEach(id=>player(id).skips=0);}
function enqueue(ids){ids.forEach(id=>{if(!S.queue.includes(id)){player(id).skips=0;S.queue.push(id);}});}
function partition(ids,baseA=[],baseB=[]){let best=null,cost=null;for(const a of combinations(ids,4-baseA.length)){const b=ids.filter(id=>!a.includes(id));if(baseB.length+b.length!==4)continue;const aa=[...baseA,...a],bb=[...baseB,...b],c=teamCost(aa,bb);if(less(c,cost)){cost=c;best={A:aa,B:bb};}}return best;}
function formationText(){const chunks=['A','B'].map(t=>{const c=coverage(S.teams[t]),q=S.config,mins=[q.minAttack,q.minDefense,q.minSet,q.minServe],missing=TAGS.filter((_,i)=>c[i]<mins[i]);return missing.length?teamName(t)+': falta cobertura em '+missing.join(', '):teamName(t)+': cobertura completa';});return chunks.join(' • ');}
function nextMatch(){if(S.status!=='ended')return;const winner=S.winner,loser=other(winner),limit=S.config.maxWins>0&&S.streak[winner]>=S.config.maxWins;transact(()=>{const win=[...S.teams[winner]],lose=[...S.teams[loser]];if(limit&&S.config.reaction==='both'){enqueue([...win,...lose]);const ids=eligible().slice(0,8);consume(ids);S.teams=partition(ids);S.streak={A:0,B:0};}else if(limit&&S.config.reaction==='split'){enqueue(lose);const fresh=eligible().slice(0,4);let best=null,cost=null;for(const pair of combinations(win,2)){const second=win.filter(id=>!pair.includes(id));const candidate=partition(fresh,pair,second),c=teamCost(candidate.A,candidate.B);if(less(c,cost)){cost=c;best=candidate;}}consume(fresh);S.teams=best;S.streak={A:0,B:0};}else{enqueue(lose);const chosen=chooseOne([],S.teams[winner]);consume(chosen);S.teams[loser]=chosen;S.streak[loser]=0;}S.matchNo++;S.score={A:0,B:0};S.server=loser;S.initialServer=loser;S.startedAt=null;S.endedAt=null;S.pausedAt=null;S.pausedMs=0;S.status='ready';S.serveReady=true;S.servesThisMatch=0;S.deuce=false;S.run={side:null,count:0};S.rally=null;S.winner=null;S.initialScores=null;S.participants=null;S.formationNote=formationText();log('Nova formação · '+S.formationNote,'formation');});toast(S.formationNote);}
function showQueue(all=false){const ids=all?S.players.map(p=>p.id):[...S.queue.filter(id=>!player(id).blocked),...S.queue.filter(id=>player(id).blocked)];openPanel(all?'Jogadores · TAGs':'Fila de espera',`<div class="row spread" style="margin-bottom:12px"><p class="description" style="margin:0">${all?'Marque as habilidades que reconhece em cada jogador.':'Quem for pulado tem prioridade na próxima formação.'}</p><button class="btn" onclick="showQueue(${!all})">${all?'Ver fila':'Todos · 19'}</button></div>${S.players.every(p=>!p.tags.length)?'<div class="note">As TAGs começam vazias para você definir. Os nomes vieram da sua lista; as estatísticas desta versão começam do zero.</div>':''}${ids.map((id,i)=>{const p=player(id),side=sideOf(id);return `<div class="listrow"><span class="ranknum">${all?(side?'●':'—'):i+1}</span><div class="grow"><div class="name">${esc(p.name)} ${p.blocked?'<span class="small">· pausado</span>':p.skips?'<span class="chip">entrada prioritária</span>':''}${side?'<span class="small"> · '+teamName(side)+'</span>':''}</div><div class="chips">${p.tags.map(t=>'<span class="chip">'+t+'</span>').join('')||'<span class="chip missing">Definir TAGs</span>'}${p.beginner?'<span class="chip">Iniciante</span>':''}<span class="small">${p.stats.games} jogos · score ${scorePlayer(id).toFixed(2)}</span></div></div><button class="btn" onclick="editPlayer('${id}',${all})">Editar</button>${!side?`<button class="btn" onclick="toggleBlocked('${id}',${all})">${p.blocked?'Liberar':'Pausar'}</button>`:''}</div>`;}).join('')}<p class="description" style="margin:12px 0 0">${esc(S.formationNote)}</p>`,true);}
function toggleBlocked(id,all){transact(()=>{const p=player(id);p.blocked=!p.blocked;p.skips=0;if(!p.blocked){S.queue=S.queue.filter(x=>x!==id);const q=S.queue;const index=p.stats.games===0?q.findIndex(x=>player(x).stats.games>0||player(x).blocked):q.findIndex(x=>player(x).blocked);q.splice(index<0?q.length:index,0,id);}log(name(id)+(p.blocked?' pausado':' liberado')+' na fila','queue');});showQueue(all);}
function editPlayer(id,all=false){const p=player(id);openPanel('TAGs · '+p.name,`<p class="description">Selecione quantas habilidades fizerem sentido. Estar sem TAGs significa “ainda não avaliado”.</p><div class="choices">${TAGS.map(t=>`<button class="tag-toggle ${p.tags.includes(t)?'on':''}" data-tag="${t}" onclick="this.classList.toggle('on')">${t}</button>`).join('')}</div><label class="switchrow">Jogador iniciante / em formação<input id="beginner" type="checkbox" ${p.beginner?'checked':''}></label><div class="row" style="margin-top:12px"><button class="btn primary" onclick="savePlayer('${id}',${all})">Salvar TAGs</button><button class="btn" onclick="showQueue(${all})">Voltar</button></div>`);}
function savePlayer(id,all){const tags=[...$('panelBody').querySelectorAll('[data-tag].on')].map(b=>b.dataset.tag),beginner=$('beginner').checked;transact(()=>{player(id).tags=tags;player(id).beginner=beginner;S.formationNote=formationText();});showQueue(all);}
function showHistory(){openPanel('Histórico da sessão',`<div class="row spread"><span class="small">${S.matches.length} partidas concluídas · ${S.log.length} ações</span><button class="btn" onclick="showStats()">Estatísticas</button></div>${S.matches.length?'<div class="chips" style="margin:12px 0">'+S.matches.map(m=>`<span class="chip">#${m.number} · ${m.score.A} × ${m.score.B} · ${teamName(m.winner)}</span>`).join('')+'</div>':''}${S.log.length?S.log.map(e=>`<div class="logrow"><span class="logscore">${e.score.A} : ${e.score.B}</span><time>#${e.match} · ${new Date(e.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</time>${esc(e.text)}</div>`).join(''):'<p class="description" style="margin-top:16px">Nenhuma ação registrada. Comece marcando o saque.</p>'}<div class="row" style="margin-top:15px"><button class="btn" onclick="undo()" ${!undos.length?'disabled':''}>↶ Desfazer última ação</button></div>`,true);}
function showStats(){const ids=S.players.map(p=>p.id).sort((a,b)=>scorePlayer(b)-scorePlayer(a));openPanel('Estatísticas · este teste',`<p class="description">Score de desempenho da sessão. A formação usa TAGs, fila e repetição de parceiros; não usa estes pontos como nota de habilidade. Largadas e fintas que pontuam entram em Ataque.</p><div style="overflow:auto"><table class="stats"><thead><tr><th>JOGADOR</th><th>J</th><th>ATQ</th><th>ACE</th><th>BLQ</th><th>ASS</th><th>REC</th><th>DEF</th><th>RCP</th><th>ERR</th><th>SCORE</th></tr></thead><tbody>${ids.map(id=>{const p=player(id),s=p.stats;return `<tr><td>${esc(p.name)}</td><td>${s.games}</td><td>${s.attack}</td><td>${s.ace}</td><td>${s.block}</td><td>${s.assist}</td><td>${s.receive}</td><td>${s.defense}</td><td>${s.recover}</td><td>${s.error}</td><td>${scorePlayer(id).toFixed(2)}</td></tr>`;}).join('')}</tbody></table></div><p class="description" style="margin-top:12px">ASS: assistência · REC: recepção · DEF: defesa forte / ataque defendido · RCP: recuperação. Apenas ações registradas contam. Ausência de registro não significa erro.</p><button class="btn" onclick="showHistory()">Voltar ao histórico</button>`,true);}
function showSettings(){const c=S.config;openPanel('Configurações',`<div class="note">Teste local, sem Firebase. Os dados ficam neste navegador quando o armazenamento está disponível. Exporte um backup para guardar sua sessão.</div><div class="formgrid"><label class="field">Pontos para vencer<input id="cfgPoints" type="number" min="3" max="99" value="${c.points}"></label><label class="field">Desempate<select id="cfgTie"><option value="three" ${c.tie==='three'?'selected':''}>3 pontos consecutivos após empate</option><option value="two" ${c.tie==='two'?'selected':''}>Diferença de 2 pontos</option></select></label><label class="field">Limite de vitórias seguidas (0 = livre)<input id="cfgWins" type="number" min="0" max="20" value="${c.maxWins}"></label><label class="field">Ao atingir o limite<select id="cfgReaction"><option value="both" ${c.reaction==='both'?'selected':''}>Sair ambos e redistribuir</option><option value="split" ${c.reaction==='split'?'selected':''}>Dividir vencedores</option></select></label><label class="field">Candidatos para formar um time<select id="cfgWindow">${[4,5,6,7,8].map(n=>`<option ${c.window===n?'selected':''}>${n}</option>`).join('')}</select></label></div><p class="tiptitle">Cobertura desejada por time</p><p class="description">Metas flexíveis: a falta de uma TAG não bloqueia a partida. Um jogador pode atender a mais de uma meta.</p><div class="formgrid">${[['minAttack','Ataque'],['minDefense','Defesa'],['minSet','Levantamento'],['minServe','Saque'],['maxBeginner','Máximo de iniciantes']].map(([k,n])=>`<label class="field">${n}<input id="cfg_${k}" type="number" min="0" max="4" value="${c[k]}"></label>`).join('')}</div><label class="switchrow">Mostrar placar<input id="cfgShow" type="checkbox" ${c.showScore?'checked':''}></label><label class="switchrow">Narrar tipo do ponto<input id="cfgSpeech" type="checkbox" ${c.speech?'checked':''}></label><div class="row wrap"><button class="btn primary" onclick="saveSettings()">Salvar configurações</button><button class="btn" onclick="showWeights()">Pesos do score</button><button class="btn" onclick="initialServeChoice()">Definir primeiro saque</button><button class="btn" onclick="rebalanceReady()">Refazer formação inicial</button></div><hr class="divider"><div class="row wrap"><button class="btn" onclick="exportData()">Exportar backup</button><button class="btn" onclick="document.getElementById('importFile').click()">Importar backup deste teste</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"><button class="btn" onclick="showHelp()">Como usar</button><button class="btn danger" onclick="confirmReset()">Nova sessão / zerar teste</button></div>`,true);}
function saveSettings(){const num=(id,min,max)=>Math.max(min,Math.min(max,Math.floor(Number($(id).value)||0))),c=clone(S.config);c.points=num('cfgPoints',3,99);c.maxWins=num('cfgWins',0,20);c.tie=$('cfgTie').value;c.reaction=$('cfgReaction').value;c.window=num('cfgWindow',4,8);for(const k of ['minAttack','minDefense','minSet','minServe','maxBeginner'])c[k]=num('cfg_'+k,0,4);c.showScore=$('cfgShow').checked;c.speech=$('cfgSpeech').checked;if(S.startedAt&&(c.points!==S.config.points||c.tie!==S.config.tie)){toast('Pontos e desempate só podem mudar antes do primeiro saque.');return;}closePanel();transact(()=>{S.config=c;S.formationNote=formationText();});toast('Configurações salvas.');}
function showWeights(){const labels={attack:'Ataque / largada / finta',ace:'Ace / falha de recepção',block:'Bloqueio com ponto',assist:'Assistência no ponto',receive:'Recepção',defense:'Defesa forte',recover:'Recuperação',error:'Desconto por erro',win:'Vitória'};openPanel('Pesos do score',`<p class="description">Mesmos pesos para todos. O score é estatístico e não transforma TAGs em notas.</p><div class="formgrid">${Object.entries(labels).map(([k,n])=>`<label class="field">${n}<input data-weight="${k}" type="number" min="0" max="20" step="0.05" value="${S.config.weights[k]}"></label>`).join('')}</div><button class="btn primary" style="margin-top:15px" onclick="saveWeights()">Salvar pesos</button>`);}
function saveWeights(){const w={};$('panelBody').querySelectorAll('[data-weight]').forEach(el=>w[el.dataset.weight]=Math.max(0,Math.min(20,Number(el.value)||0)));closePanel();transact(()=>S.config.weights=w);}
function initialServeChoice(){if(!fullCourt())return toast('Complete a formação inicial primeiro.');if(S.startedAt)return toast('O primeiro saque só pode ser alterado antes da partida.');pick('Primeiro saque','A posição 1 do time selecionado começará sacando.', ['A','B'].map(t=>({label:teamName(t)+' · '+name(S.teams[t][0]),fn:()=>{closePanel();transact(()=>{S.server=t;S.initialServer=t});}})));}
function selectSlot(t,i){i=Number(i);if(S.startedAt||S.matchNo!==1)return;const current=S.teams[t][i];pickPlayer(`${teamName(t)} · posição ${i+1}`,current?'Escolha outro jogador liberado ou libere a vaga.':'Selecione um jogador da fila para esta posição.',eligible(),id=>{closePanel();transact(()=>{if(current)S.queue.push(current);S.queue=S.queue.filter(x=>x!==id);S.teams[t][i]=id;player(id).skips=0;S.formationNote=fullCourt()?formationText():'Complete as posições restantes.';});},current?[{label:'Liberar esta posição',fn:()=>{closePanel();transact(()=>{S.teams[t][i]=null;S.queue.push(current);});}}]:[]);}
function autoInitial(){const candidates=[...eligible(),...S.teams.A,...S.teams.B].filter(id=>id&&!player(id).blocked);if(candidates.length<8){toast('Libere pelo menos oito jogadores na fila.');return false;}transact(()=>{enqueue([...S.teams.A,...S.teams.B].filter(Boolean));const ids=eligible().slice(0,8);consume(ids);S.teams=partition(ids);S.formationNote=formationText();log('Formação inicial automática · '+S.formationNote,'formation');});return true;}
function rebalanceReady(){if(S.startedAt||S.matchNo!==1)return toast('Disponível antes de começar a primeira partida.');closePanel();autoInitial();}
function scoreEditor(){if(!fullCourt())return toast('Complete a formação inicial primeiro.');if(S.status==='ended')return toast('Para corrigir o ponto final, use Desfazer.');openPanel('Corrigir placar',`<p class="description">Ajuste manual não atribui estatísticas. Para corrigir uma ação recém-marcada, prefira Desfazer.</p><div class="formgrid"><label class="field">Time A<input id="manualA" type="number" min="0" max="99" value="${S.score.A}"></label><label class="field">Time B<input id="manualB" type="number" min="0" max="99" value="${S.score.B}"></label><label class="field">Time com saque<select id="manualServer"><option value="A" ${S.server==='A'?'selected':''}>Time A</option><option value="B" ${S.server==='B'?'selected':''}>Time B</option></select></label></div><p class="description" style="margin-top:12px">As posições atuais serão mantidas. Em desempate por sequência, a contagem de 3 recomeça após a correção.</p><button class="btn primary" onclick="saveManualScore()">Aplicar correção</button>`);}
function saveManualScore(){const a=Math.min(99,Math.max(0,Math.floor(Number($('manualA').value)||0))),b=Math.min(99,Math.max(0,Math.floor(Number($('manualB').value)||0))),server=$('manualServer').value;closePanel();transact(()=>{if(a||b)startClock();S.score={A:a,B:b};S.server=server;S.serveReady=true;S.rally=null;S.deuce=S.config.tie==='three'&&Math.min(a,b)>=S.config.points-1;S.run={side:null,count:0};const leader=a>b?'A':'B';if((S.config.tie==='two'&&Math.max(a,b)>=S.config.points&&Math.abs(a-b)>=2)||(S.config.tie==='three'&&!S.deuce&&Math.max(a,b)>=S.config.points))finish(leader);log('Placar corrigido manualmente','correction');});}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='VoleiHub_Areia_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup preparado para download.');}
async function importData(file){if(!file)return;try{const s=JSON.parse(await file.text());if(!validState(s))throw Error('invalid');pick('Importar sessão de teste?','Isso substituirá a sessão local atual. Você poderá desfazer esta importação.',[{label:'Importar backup',fn:()=>{closePanel();transact(()=>{S=s;});toast('Backup importado.');}},{label:'Cancelar',fn:closePanel}]);}catch(e){toast('Arquivo incompatível. Importe um backup exportado por este HTML.');}}
function confirmReset(){pick('Começar uma nova sessão?','Placar, histórico e estatísticas locais serão zerados. As TAGs e configurações serão mantidas.',[{label:'Começar nova sessão',cls:'danger',fn:()=>{closePanel();transact(()=>{const old=S;S=initial();S.config=clone(old.config);S.players.forEach(p=>{const before=old.players.find(x=>x.id===p.id);p.tags=before?.tags||[];p.beginner=before?.beginner||false;});S.formationNote='Toque nas vagas para formar os times.';});}},{label:'Cancelar',fn:closePanel}]);}
function showHelp(){openPanel('Como usar · versão 4.1',`<p class="eyebrow">Toques · posse de bola · áudio</p><p class="tiptitle">Monte e marque</p><p class="description">Toque nas vagas para montar o primeiro confronto, ou use “Formar times”. Assim que as oito posições estiverem preenchidas, toque no jogador para abrir as ações, mesmo antes de marcar o saque. O movimento do dedo não seleciona ações. Toque em × para cancelar.</p><p class="tiptitle">Levantador em destaque</p><p class="description">Na escolha de quem levantou, o jogador da posição 2 (rede) ganha destaque dourado na quadra e na roda. A escolha continua manual: você pode informar outro jogador ou “Sem levantador”. Se quem atacou estiver na posição 2, ele não aparece como seu próprio levantador.</p><p class="tiptitle">Narração e apito</p><p class="description">Com “Narrar tipo do ponto” ativado nas configurações, você ouve “Ponto de saque”, “Ponto de ataque” (também para largada e finta), “Ponto de bloqueio” ou o tipo de erro. Toque em “Até ${S.config.points}” para ouvir o placar, sempre começando pelo time com saque. O apito central no rodapé emite um toque curto; a intensidade depende do volume de mídia do aparelho.</p><p class="tiptitle">Cronômetro e posse</p><p class="description">Toque no cronômetro para iniciar, pausar ou retomar. Marque o saque e a recepção para atualizar a posse; só o time com a bola pode atacar. A bola e os jogadores se animam conforme as ações registradas. Defesas não geram ponto.</p><p class="tiptitle">Fila e segurança das marcações</p><p class="description">A próxima formação segue as TAGs e as prioridades da fila. Desfazer restaura placar, posições e estatísticas. As estatísticas são locais: exporte um backup nas configurações para guardar o teste.</p><button class="btn primary" onclick="closePanel()">Voltar à quadra</button>`,true);}
function speak(text){if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('Narração indisponível neste navegador.');return false;}try{const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=1;u.volume=1;const voice=window.speechSynthesis.getVoices().find(v=>/^pt[-_]BR$/i.test(v.lang));if(voice)u.voice=voice;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);return true;}catch(e){toast('Não foi possível iniciar a narração.');return false;}}
function announceScore(){return speak(S.score[S.server]+' a '+S.score[other(S.server)]);}
function narratePoint(e){if(!S.config.speech||!['point','error'].includes(e.kind))return;const type={ace:'Ponto de saque',attack:'Ponto de ataque',tip:'Ponto de ataque',feint:'Ponto de ataque',block:'Ponto de bloqueio',errServe:'Erro de saque',errAttack:'Erro de ataque',errTouch:'Erro de toque'}[e.action];if(type)speak(type);}
let whistleContext=null,whistleNodes=[],whistleRun=0;
async function blowWhistle(){const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return toast('Áudio de apito indisponível neste navegador.');const run=++whistleRun;whistleNodes.forEach(n=>{try{n.stop()}catch{}});whistleNodes=[];try{if(!whistleContext||whistleContext.state==='closed')whistleContext=new Ctor();if(whistleContext.state==='suspended')await whistleContext.resume();if(run!==whistleRun)return;window.speechSynthesis?.cancel();const ctx=whistleContext,t=ctx.currentTime,duration=.72,master=ctx.createGain(),compressor=ctx.createDynamicsCompressor();compressor.threshold.value=-8;compressor.knee.value=3;compressor.ratio.value=12;compressor.attack.value=.003;compressor.release.value=.08;master.gain.setValueAtTime(0,t);master.gain.linearRampToValueAtTime(.72,t+.012);master.gain.setValueAtTime(.72,t+duration-.08);master.gain.linearRampToValueAtTime(0,t+duration);master.connect(compressor);compressor.connect(ctx.destination);const tones=[2700,3250].map((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(hz,t);o.frequency.linearRampToValueAtTime(hz+70,t+duration);g.gain.value=i?.32:.62;o.connect(g);g.connect(master);o.start(t);o.stop(t+duration+.02);return o;});const flutter=ctx.createOscillator(),depth=ctx.createGain();flutter.frequency.value=42;depth.gain.value=.08;flutter.connect(depth);depth.connect(master.gain);flutter.start(t);flutter.stop(t+duration+.02);whistleNodes=[...tones,flutter];$('whistleBtn').classList.add('sounding');tones[0].onended=()=>{master.disconnect();compressor.disconnect();depth.disconnect();if(run===whistleRun){whistleNodes=[];$('whistleBtn').classList.remove('sounding');}};}catch(e){$('whistleBtn').classList.remove('sounding');toast('Não foi possível tocar o apito. Tente novamente.');}}
render();setInterval(tick,1000);
</script></body></html>
